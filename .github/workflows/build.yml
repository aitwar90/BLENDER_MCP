name: Build Blender Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    # 1. Pobranie źródeł kodu
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Ninja Build Tool
      uses: llvm/actions/install-ninja@main

    # 2. Pobranie bibliotek LFS w podkatalogu blendera
    - name: Download & Pull External Libraries
      shell: cmd
      working-directory: blender-main/blender
      run: |
        git submodule update --init --recursive lib/windows_x64
        cd lib\windows_x64
        git lfs pull

    # 3. Wykonanie Twojego patchera przed kompilacją
    - name: Run Patch and Prepare Files
      shell: cmd
      working-directory: PrepareFiles
      run: |
        python patch_and_compile.py

    # 4. Właściwa kompilacja w katalogu, gdzie znajduje się make.bat
    - name: Build Blender
      shell: cmd
      working-directory: blender-main/blender
      run: |
        make.bat ninja release

    # 5. Spakowanie i wysłanie gotowego artefaktu
    - name: Upload Blender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-MCP-Windows
        path: blender-main/build_windows_Release_x64_vc17_Release/bin/Release/**
