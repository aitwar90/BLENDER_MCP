name: Build Blender Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 1. Pobranie prekompilowanych bibliotek Blendera dla Windows 64-bit
    - name: Checkout Blender Win64 Libraries
      run: |
        git clone --depth 1 https://projects.blender.org/blender/blender-assets.git lib/win64_vc15

    # 2. Uruchomienie Twojego patchera przed kompilacją
    - name: Run Patch and Prepare Files
      run: |
        cd PrepareFiles
        python patch_and_compile.py

    # 3. Kompilacja Blendera przy użyciu oficjalnego buildsystemu Blendera
    - name: Build Blender
      run: |
        cd blender-main
        .\make.bat release

    # 4. Spakowanie i udostępnienie artefaktu (całego folderu bin)
    - name: Upload Blender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-MCP-Windows
        path: ../build_windows_Full_x64_vc16_Release/bin/Release/*