name: Build Blender Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 1. Oficjalny skrypt Blendera dociągający biblioteki (bez błędnej flagi)
    - name: Download Blender Dependencies
      shell: cmd
      working-directory: blender-main/blender
      run: |
        python build_files/utils/make_update.py

    # 2. Uruchomienie Twojego patchera przed kompilacją
    - name: Run Patch and Prepare Files
      run: |
        cd PrepareFiles
        python patch_and_compile.py

    # 3. Właściwa kompilacja w cmd
    - name: Build Blender
      shell: cmd
      working-directory: blender-main/blender
      run: |
        make.bat release

    # 4. Spakowanie i udostępnienie artefaktu
    - name: Upload Blender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-MCP-Windows
        path: blender-main/build_windows_Release_x64_vc*_Release/bin/Release/**
