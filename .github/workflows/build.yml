name: Build Blender Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Ninja Build Tool
      uses: llvm/actions/install-ninja@main

    # 1. Pobranie bibliotek binarnych pod Windowsa z Git LFS Blendera
    - name: Fetch External Windows Libraries
      shell: cmd
      run: |
        if not exist blender-main\blender\lib\windows_x64 mkdir blender-main\blender\lib\windows_x64
        cd blender-main\blender\lib\windows_x64
        git init
        git remote add origin https://projects.blender.org/blender/lib-windows_x64.git
        git fetch --depth 1 origin main
        git checkout main
        git lfs pull

    # 2. Naprawa pliku startup.blend (pobranie prawdziwej binarki z oficjalnego repo Blendera)
    - name: Fix startup.blend asset
      shell: cmd
      run: |
        curl -L -o blender-main\blender\release\datafiles\startup.blend https://projects.blender.org/blender/blender/raw/branch/main/release/datafiles/startup.blend

    # 3. Modyfikacja kodów źródłowych patcherem
    - name: Run Patch and Prepare Files
      shell: cmd
      run: |
        python PrepareFiles\patch_and_compile.py

    # 4. Właściwa kompilacja
    - name: Build Blender
      shell: cmd
      working-directory: blender-main/blender
      run: |
        make.bat ninja release

    # 5. Spakowanie artefaktu
    - name: Upload Blender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-MCP-Windows
        path: blender-main/build_windows_Release_x64_vc17_Release/bin/Release/**
