name: Build Blender Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    # 1. Pobranie źródeł kodu bez rekursywnych submodułów
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Ninja Build Tool
      uses: llvm/actions/install-ninja@main

    # 2. Dociągnięcie bibliotek LFS w podkatalogu Blendera
    - name: Pull External LFS Libraries
      shell: cmd
      run: |
        cd blender-main\blender
        git submodule update --init --recursive lib/windows_x64
        cd lib\windows_x64
        git lfs pull

    # 3. Modyfikacja kodów źródłowych Twoim skryptem (odpalany z root workspace'a)
    - name: Run Patch and Prepare Files
      shell: cmd
      run: |
        python PrepareFiles\patch_and_compile.py

    # 4. Właściwa kompilacja z wymuszeniem 'y' na zapytania batcha
    - name: Build Blender
      shell: cmd
      working-directory: blender-main/blender
      run: |
        echo y | make.bat ninja release

    # 5. Eksport gotowego bina
    - name: Upload Blender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-MCP-Windows
        path: blender-main/build_windows_Release_x64_vc17_Release/bin/Release/**
