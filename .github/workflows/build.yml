name: Build Blender Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Ninja Build Tool
      uses: llvm/actions/install-ninja@main

    # Pobieramy biblioteki bezpośrednio z oficjalnego repozytorium SVN Blendera dla VS2022/x64
    - name: Checkout SVN External Libraries
      shell: cmd
      run: |
        if not exist "blender-main\blender\lib\windows_x64" mkdir "blender-main\blender\lib\windows_x64"
        svn checkout https://svn.blender.org/svnroot/bf-blender/trunk/lib/windows_x64 "blender-main\blender\lib\windows_x64" --non-interactive --trust-server-cert-quiet --depth files
        cd blender-main\blender\lib\windows_x64
        svn update --non-interactive --trust-server-cert-quiet

    - name: Run Patch and Prepare Files
      shell: cmd
      run: |
        python PrepareFiles\patch_and_compile.py

    - name: Build Blender
      shell: cmd
      working-directory: blender-main/blender
      run: |
        make.bat ninja release nobuild_update

    - name: Upload Blender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-MCP-Windows
        path: blender-main/build_windows_Release_x64_vc17_Release/bin/Release/**
