name: Build Blender Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    # 1. Pobranie źródeł kodu z automatycznym dociągnięciem submodułów
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Ninja Build Tool
      uses: llvm/actions/install-ninja@main

    # 2. Dociągnięcie plików LFS w bibliotekach Windows (uruchamiane z korzenia)
    - name: Pull LFS Libraries
      shell: cmd
      run: |
        cd blender-main\blender\lib\windows_x64
        git lfs pull

    # 3. Wykonanie Twojego patchera przed kompilacją
    - name: Run Patch and Prepare Files
      shell: cmd
      working-directory: PrepareFiles
      run: |
        python patch_and_compile.py

    # 4. Kompilacja z flagą braku pytań o biblioteki
    - name: Build Blender
      shell: cmd
      working-directory: blender-main/blender
      run: |
        make.bat ninja release no_build_update

    # 5. Spakowanie i wysłanie gotowego artefaktu
    - name: Upload Blender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-MCP-Windows
        path: blender-main/build_windows_Release_x64_vc17_Release/bin/Release/**
