name: Build Blender Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 1. Uruchomienie Twojego patchera przed kompilacją
    - name: Run Patch and Prepare Files
      run: |
        cd PrepareFiles
        python patch_and_compile.py

    # 2. Pobranie zależy i kompilacja przez make.bat
    - name: Download Blender Dependencies & Build
      working-directory: blender-main/blender
      run: |
        cmd.exe /c "make.bat update"
        cmd.exe /c "make.bat release"

    # 3. Spakowanie i udostępnienie artefaktu (sprawdzona ścieżka wyjściowa Blendera)
    - name: Upload Blender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-MCP-Windows
        path: blender-main/build_windows_Release_x64_vc*_Release/bin/Release/**
