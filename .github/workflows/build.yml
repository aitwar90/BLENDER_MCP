name: Build Blender Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 1. Pobranie bibliotek bezpośrednio z Git LFS / oficjalnego skryptu Blendera
    - name: Download Blender Win64 Libraries
      run: |
        git clone --depth 1 https://projects.blender.org/blender/lib-windows_x64.git blender-main/lib/win64_vc15
        git clone --depth 1 https://projects.blender.org/blender/lib-windows_x64.git blender-main/lib/windows_x64

    # 2. Uruchomienie Twojego patchera przed kompilacją
    - name: Run Patch and Prepare Files
      run: |
        cd PrepareFiles
        python patch_and_compile.py

    # 3. Weryfikacja obecności folderu i odpalenie kompilacji bez pytań
    - name: Build Blender
      working-directory: blender-main/blender
      run: |
        if not exist "..\lib\windows_x64" mkdir "..\lib\windows_x64"
        cmd.exe /c "echo y| make.bat release"

    # 4. Spakowanie i udostępnienie artefaktu
    - name: Upload Blender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-MCP-Windows
        path: blender-main/build_windows_Release_x64_vc*_Release/bin/Release/**
