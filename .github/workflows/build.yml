name: Build Blender Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Ninja Build Tool
      uses: llvm/actions/install-ninja@main

    # 1. Pobranie/zaktualizowanie bibliotek binarnych LFS przed odpaleniem make.bat
    - name: Checkout & Pull External Libraries
      shell: cmd
      run: |
        git submodule update --init --recursive lib/windows_x64
        cd lib\windows_x64
        git lfs pull

    # 2. Uruchomienie patchera
    - name: Run Patch and Prepare Files
      shell: cmd
      run: |
        cd PrepareFiles
        python patch_and_compile.py

    # 3. Właściwa kompilacja (używamy ninja dla wydajności i pomijamy wadliwe pobieranie SVN)
    - name: Build Blender
      shell: cmd
      run: |
        make.bat ninja release

    # 4. Pakowanie artefaktu
    - name: Upload Blender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-MCP-Windows
        path: ..\build_windows_Release_x64_vc17_Release\bin\Release\**
